<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Delete flower · Dyls Flower Shop</title>
    <style>
        :root { --ink:#292333; --muted:#756d80; --purple:#63439a; --pale:#f3edf9; --line:#e5deec; --cream:#fbf9fd; --danger:#a43352; --danger-pale:#fff0f3; }
        * { box-sizing:border-box; }
        body { min-height:100vh; margin:0; display:grid; place-items:center; padding:24px; background:var(--cream); color:var(--ink); font:15px/1.5 Georgia,serif; }
        main { width:min(100%,560px); padding:34px; background:white; border:1px solid var(--line); border-radius:8px; box-shadow:0 18px 50px #3f2a590b; }
        .brand { display:flex; align-items:center; gap:11px; margin-bottom:34px; color:var(--purple); font:800 20px/1.2 Georgia,serif; }
        .mark { width:36px; height:36px; display:grid; place-items:center; border-radius:8px; background:var(--purple); color:white; }
        .eyebrow { margin:0 0 8px; color:var(--danger); font:700 12px/1.4 Arial,sans-serif; text-transform:uppercase; }
        h1 { margin:0 0 8px; font-size:32px; line-height:1.15; }
        .intro { margin:0 0 24px; color:var(--muted); }
        .flower { padding:18px; border:1px solid var(--line); border-radius:8px; background:#fcfaff; }
        .name { margin:0 0 5px; font-size:22px; font-weight:700; overflow-wrap:anywhere; }
        .details { margin:0; color:var(--muted); }
        .actions { display:flex; justify-content:flex-end; gap:10px; margin-top:26px; }
        .button { display:inline-flex; align-items:center; justify-content:center; min-height:42px; padding:10px 16px; border:1px solid transparent; border-radius:7px; background:var(--purple); color:white; font:700 14px Arial,sans-serif; text-decoration:none; cursor:pointer; }
        .button.secondary { border-color:var(--line); background:white; color:var(--purple); }
        .button.delete { background:var(--danger); }
        @media(max-width:480px) { main { padding:25px 21px; } .actions { flex-direction:column-reverse; } .button { width:100%; } }
    </style>
</head>
<body>
<main>
    <div class="brand"><span class="mark">✿</span> Dyls Flower Shop</div>
    <p class="eyebrow">Remove from inventory</p>
    <h1>Delete this flower?</h1>
    <p class="intro">This action cannot be undone. Confirm only if you want to remove this flower from your inventory.</p>
    <section class="flower" aria-label="Flower to delete">
        <p class="name">{{ flower.flower_name }}</p>
        <p class="details">{{ flower.flower_type }} · {{ flower.color }} · {{ flower.quantity }} in stock</p>
    </section>
    <div class="actions">
        <a class="button secondary" href="{% url 'index' %}">Cancel</a>
        <form method="post">
            {% csrf_token %}
            <button class="button delete" type="submit">Delete flower</button>
        </form>
    </div>
</main>
</body>
</html>
